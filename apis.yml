name: Scondoo
description: >-
  Scondoo is a German consumer cashback and coupon platform, operated by acardo group AG, that
  lets shoppers earn money back on everyday grocery and drugstore purchases. Users browse
  exclusive cashback deals in the scondoo iOS and Android apps, buy the qualifying products at
  any supermarket or drugstore (Kaufland, REWE, EDEKA, Netto, Aldi, Lidl, dm, Rossmann and many
  more), then snap a photo of the receipt to have the cashback credited to their balance and paid
  out via bank transfer or PayPal. The service is consumer-facing and mobile-only; it publishes
  no public developer API, SDKs, or partner integration surface.
